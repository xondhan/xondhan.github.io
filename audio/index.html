<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        h3 {
            color: green;
            margin-bottom: 40px;
        }
        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            background: #e8e8e8;
            color: black;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s ease;
            width: 120px;
        }
        button.active {
            background: skyblue;
            color: white;
        }
    </style>
</head>
<body>

    <h3>PLAY MP3</h3>

    <div class="container">
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_d8367a27deab42699bb08615ee003bcd.mp3">Advice</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_71401f85d1dd45b08fd62531450660bb.mp3">Go</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_4519602511514e63947101e7642711ca.mp3">Good</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_4ff7b1a9c49d44d99be28010a5f031cd.mp3">Success</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_ec6279ac90e24a2096ccb32f18aa1dde.mp3">Asr</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_45aef27bb4d74df18a64bfe36e03b2ab.mp3">Falak</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_530760958700443db3955c2f63a8509a.mp3">Fil</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_0491f1e8f2b44fb894266d493b176625.mp3">Ikhlas</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_571bfd6b2abb49e1a15041167526e457.mp3">Kabirn</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_39105261f1504aa297e4e388c1573728.mp3">Kaudr</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_26dc1f8b02cc49c4b0da41486fb81260.mp3">Masad</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_dd32251112ea4623a285731e024a6388.mp3">Maun</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_719f5b4ae2a34fb0a811164a4ae1f7d4.mp3">Nas</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_8b0f78d7840a43f992d4db8db9f02cba.mp3">Nasr</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_9ee841699cda4438854d21c41dc1609a.mp3">Qadr</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_3c86d870db9145289e14be0ba0f62016.mp3">Quresh</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_26775a168eab4d4e8df12d40c0da4cfc.mp3">Tin</button>
    </div>

    <audio id="audioPlayer" loop></audio>

    <script>
        const buttons = document.querySelectorAll('.play-btn');
        const audioPlayer = document.getElementById('audioPlayer');

        buttons.forEach(button => {
            button.addEventListener('click', function() {
                if (audioPlayer.src !== this.getAttribute('data-src') || audioPlayer.paused) {
                    audioPlayer.src = this.getAttribute('data-src');
                    audioPlayer.play();
                    buttons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                } else {
                    audioPlayer.pause();
                    this.classList.remove('active');
                }
            });
        });

        audioPlayer.addEventListener('ended', function() {
            const activeButton = document.querySelector('.play-btn.active');
            if (activeButton) {
                audioPlayer.play(); 
            }
        });
    </script>

</body>
</html>
