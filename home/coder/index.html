
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Coder</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#f1f5f9;font-family:system-ui,Arial,sans-serif;color:#0f172a}
.card{width:100%;max-width:360px;padding:24px;background:#fff;border-radius:14px;box-shadow:0 8px 28px #0f172a10}
h3{margin:0 0 18px;text-align:center;font-size:18px;color:#087f5b;font-weight:700}
textarea{width:100%;height:100px;padding:12px;border:1px solid #cbd5e1;border-radius:8px;resize:vertical;font:inherit;outline-color:#2563eb}
.buttons{display:flex;gap:8px;margin:12px 0}
button{flex:1;padding:12px 8px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:650;cursor:pointer}
#save{background:#087f5b}
button:disabled{opacity:.45;cursor:not-allowed}
#preview{min-height:220px;display:grid;place-items:center;padding:12px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px}
#preview canvas,#preview img{display:block;width:100%;max-width:200px;height:auto;image-rendering:pixelated}
</style>
</head>
<body>
<main class="card">
<h3>THE QR CODER</h3>
<textarea id="text" placeholder="Type here..."></textarea>
<div class="buttons">
<button id="make">Make</button>
<button id="save" disabled>Download</button>
</div>
<div id="preview">Loading...</div>
</main>

<script>
const $=id=>document.getElementById(id);
const SIZE=1200,BORDER=4;
let png="";

function generateQR(){
 const text=$("text").value.trim();
 if(!text)return;
 const qr=qrcode(0,"H");
 qr.addData(text);qr.make();
 const n=qr.getModuleCount(),total=n+BORDER*2;
 const unit=Math.floor(SIZE/total),offset=Math.floor((SIZE-unit*total)/2);
 const margin=unit*BORDER;
 const c=document.createElement("canvas");
 c.width=c.height=SIZE;
 const ctx=c.getContext("2d",{alpha:false});
 ctx.fillStyle="#fff";ctx.fillRect(0,0,SIZE,SIZE);
 ctx.fillStyle="#087f5b";
 for(let y=0;y<n;y++)for(let x=0;x<n;x++)
  if(qr.isDark(y,x))ctx.fillRect(offset+margin+x*unit,offset+margin+y*unit,unit,unit);
 png=c.toDataURL("image/png");
 const img=new Image();
 img.src=png;img.alt="QR code";
 $("preview").replaceChildren(img);
 $("save").disabled=false;
}

$("make").addEventListener("click",generateQR);
$("save").addEventListener("click",()=>{
 if(!png)return;
 const a=document.createElement("a");
 a.href=png;a.download="qrcode.png";a.click();
});
$("text").addEventListener("keydown",e=>{
 if((e.ctrlKey||e.metaKey)&&e.key==="Enter")generateQR();
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
</body>
</html>
