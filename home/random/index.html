<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generate Random</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h3 {
      text-align: center;
      color: green;
    }

    .input-container {
      width: 45%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    input[type="text"] {
      flex-grow: 1;
      padding: 10px;
      margin-right: 10px;
      font-size: 16px;
    }

    .mb-label {
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      padding: 8px 15px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
    }

    button:hover {
      background-color: #45a049;
    }

    #progress {
      width: 50%;
      background-color: #ddd;
      display: none;
      height: 30px;
      border-radius: 13px;
      overflow: hidden;
      margin-top: 10px;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background-color: #4CAF50;
      transition: width 0.4s ease-in-out;
    }
  </style>
</head>
<body>
  <h3>RANDOM FILE MAKER</h3>

  <div class="input-container">
    <input type="text" id="fileSize" inputmode="decimal" placeholder="">
    <span class="mb-label">MB</span>
  </div>

  <button onclick="generateFile()">Save Now</button>

  <div id="progress">
    <div id="progressBar"></div>
  </div>

  <script>
    function generateFile() {
      const fileSizeMB = parseFloat(document.getElementById("fileSize").value.trim());
      const MAX_MB = 17 * 1024;

      if (isNaN(fileSizeMB) || fileSizeMB <= 0) {
        alert("Enter a valid number greater than 0.");
        return;
      }

      if (fileSizeMB > MAX_MB) {
        alert("We can make Max 17GB only!");
        return;
      }

      const chunkSize = 1024 * 1024;
      const totalBytes = Math.floor(fileSizeMB * chunkSize);
      const totalChunks = Math.ceil(totalBytes / chunkSize);
      let currentChunk = 0;
      const chunks = [];

      const progress = document.getElementById("progress");
      const progressBar = document.getElementById("progressBar");
      progress.style.display = "block";
      progressBar.style.width = "0%";

      const worker = new Worker(URL.createObjectURL(new Blob([`
        self.onmessage = function(e) {
          const { chunkSize, currentChunk, totalChunks } = e.data;
          let result = '';
          for (let i = 0; i < chunkSize; i++) {
            result += Math.floor(Math.random() * 10);
          }
          const encoder = new TextEncoder();
          const buffer = encoder.encode(result).buffer;
          self.postMessage({
            buffer: buffer,
            progress: Math.round((currentChunk / totalChunks) * 100)
          });
        };
      `], { type: "application/javascript" })));

      worker.onmessage = function (e) {
        if (e.data.buffer) {
          chunks.push(new Blob([e.data.buffer], { type: "application/octet-stream" }));
          currentChunk++;
          progressBar.style.width = Math.min(100, Math.round((currentChunk / totalChunks) * 100)) + "%";

          if (currentChunk < totalChunks) {
            worker.postMessage({ chunkSize, totalChunks, currentChunk });
          } else {
            const finalBlob = new Blob(chunks, { type: "application/octet-stream" });
            const url = URL.createObjectURL(finalBlob);
            const safeName = `${fileSizeMB}.mb`;
            const link = document.createElement("a");
            link.href = url;
            link.download = safeName;
            link.click();
            URL.revokeObjectURL(url);
            progress.style.display = "none";
          }
        }
      };

      worker.postMessage({ chunkSize, totalChunks, currentChunk });
    }
  </script>
</body>
</html>
