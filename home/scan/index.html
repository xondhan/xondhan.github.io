<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Scan</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.18.5/umd/index.min.js"></script>
  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
    }
    h3 {
      text-align: center;
      color: #4CAF50;
    }
    #output {
      margin-top: 25px;
      font-size: 16px;
      color: #555;
      text-align: center;
    }
    input[type="file"] {
      display: block;
      margin: 10px auto;
    }
  </style>
</head>
<body>
  <h3>QR SCANNER</h3>
  <input type="file" accept="image/*" id="fileInput" />
  <div id="output"></div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const output = document.getElementById('output');

    fileInput.addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (!file) return;

      output.textContent = "Analyzing image...";

      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function () {
          setTimeout(() => processImage(img), 1000); // Add a 1-second delay
        };
      };
      reader.readAsDataURL(file);
    });

    function processImage(img) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0, img.width, img.height);

      applyFilters(ctx, canvas.width, canvas.height);
      decodeQRCodeAndBarcode(ctx, canvas, img.width, img.height);
    }

    function applyFilters(ctx, width, height) {
      ctx.filter = 'contrast(120%)';
      ctx.drawImage(ctx.canvas, 0, 0, width, height);
      ctx.filter = 'none';
    }

    function decodeQRCodeAndBarcode(ctx, canvas, width, height) {
      const imageData = ctx.getImageData(0, 0, width, height);
      let decodedQR = jsQR(imageData.data, imageData.width, imageData.height);

      if (decodedQR) {
        output.textContent = `QR Code Decoded: ${decodedQR.data}`;
      } else {
        decodeBarcode(ctx, canvas, width, height);
      }
    }

    function decodeBarcode(ctx, canvas, width, height) {
      const codeReader = new ZXing.BrowserMultiFormatReader();
      codeReader.decodeFromCanvas(canvas)
        .then(result => {
          output.textContent = `Barcode Decoded: ${result.text}`;
        })
        .catch(err => {
          output.textContent = "No QR or Barcode Found.";
        });
    }
  </script>
</body>
</html>
