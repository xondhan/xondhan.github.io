<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        h3 {
            color: green;
            margin-bottom: 40px;
        }
        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            background: #e8e8e8;
            color: black;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s ease;
            width: 120px;
        }
        button.active {
            background: skyblue;
            color: white;
        }
    </style>
</head>
<body>

    <h3>PLAY MP3</h3>

    <div class="container">
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_040de8d2360f4dc091bf17fa4f40a873.mp3">Advice</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_55b72b57790244a19473f1fcb6a771b9.mp3">Dumb</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_1b2d25959f0d4c9e9a73d0f3a8d2fcfe.mp3">Go</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_c7a9c00814d24cbe9adcbde634a9b753.mp3">Good</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_2aa5ba77b2644041897c2b971d7117b0.mp3">Rules</button>
        <button class="play-btn" data-src="https://static.wixstatic.com/mp3/90406e_9d767bf5a0cf416abcc75aa6de89b737.mp3">Success</button>
    </div>

    <audio id="audioPlayer" loop></audio>

    <script>
        const buttons = document.querySelectorAll('.play-btn');
        const audioPlayer = document.getElementById('audioPlayer');

        buttons.forEach(button => {
            button.addEventListener('click', function() {
                if (audioPlayer.src !== this.getAttribute('data-src') || audioPlayer.paused) {
                    audioPlayer.src = this.getAttribute('data-src');
                    audioPlayer.play();
                    buttons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                } else {
                    audioPlayer.pause();
                    this.classList.remove('active');
                }
            });
        });

        audioPlayer.addEventListener('ended', function() {
            const activeButton = document.querySelector('.play-btn.active');
            if (activeButton) {
                audioPlayer.play(); 
            }
        });
    </script>

</body>
</html>
