<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plain TXT</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 15px;
    }

    h3 {
      text-align: center;
      color: green;
    }

    textarea {
      width: 100%;
      height: 300px;
      margin-top: 10px;
      padding: 10px;
      box-sizing: border-box;
    }

    .button-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      padding: 0 3%;
    }

    .action-button {
      padding: 10px 20px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }

    .action-button:hover {
      background-color: #45a049;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <h3>SIMPLEST TXT MAKER</h3>

  <textarea id="txtContent" placeholder="Type here..."></textarea>

  <div class="button-bar">
    <label class="action-button" for="fileInput">Choose File</label>
    <input type="file" id="fileInput" accept=".txt" onchange="loadFile(event)">
    <button class="action-button" onclick="saveFile()">Save Now</button>
  </div>

  <script>
    let saveCount = localStorage.getItem("saveCount") || 0;

    function numberToLetters(num) {
      let result = "";
      do {
        result = String.fromCharCode(97 + (num % 26)) + result;
        num = Math.floor(num / 26) - 1;
      } while (num >= 0);
      return result;
    }

    function saveFile() {
      const content = document.getElementById("txtContent").value;
      const blob = new Blob([content], { type: "text/html" });
      const fileName = numberToLetters(saveCount) + ".html";
      saveCount++;
      localStorage.setItem("saveCount", saveCount);

      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function loadFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById("txtContent").value = e.target.result;
      };
      reader.readAsText(file);
    }
  </script>

</body>
</html>
